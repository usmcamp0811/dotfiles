# tack pins
# edit by hand or with tack add / rm / alias
# nix reads pins.lock.json
# this file drives tack update

# Downstream tack projects (Campground) override pins here (e.g. fmf.follows mcp-nixos / authentik-nix).
[tack]
recomposable = true

# shorturl schemes
# scheme rest expands rest into {path}
[shorturls]
# gh = "github:{path}"

# all_follow maps input names at every depth to the top-level pin they follow
# opt out per-input with exclude_follow, scope with flake: or tack:
[all_follow]
# Generated from `tack dedup` (Nov 2026), keeping only names where every occurrence in the tree is
# the same repo (and, for our own pins, the same repo as our pin). Deliberately NOT here:
#   nixpkgs*/unstable/old-nixpkgs/pyarrow (intentional versions), systems (4 different repos),
#   flake-compat (3 forks), poetry2nix (our pin is a fork), nixpkgs-lib, pyproject-nix, bun2nix,
#   nix-ld, nix-snapshotter, nixtheplanet, k0s-nix (name shared by different repos),
#   crystal-forge/upgrade-predecessor and nix-ai/enable-container-tests (intentional).
# campground-nvim = "campground-nvim" also breaks the campground-nvim -> dotfiles -> campground-nvim
# cycle that nested four old copies of this repo (and all their inputs).
