# Messages

set -g message-style 'fg=colour9 bg=colour16 bold'

#################

### CLIPBOARD

#################

# Enable mouse support.

set -g mouse on

# Use OSC 52 to send copied text through SSH to the local terminal.

set -s set-clipboard external

# Tell tmux which terminal types support OSC 52 clipboard operations.

set -as terminal-features ',xterm*:clipboard'
set -as terminal-features ',xterm-kitty:clipboard'
set -as terminal-features ',foot*:clipboard'
set -as terminal-features ',tmux*:clipboard'
set -as terminal-features ',screen*:clipboard'

# Use vi key bindings in copy mode.

setw -g mode-keys vi

# Begin character, line, or rectangle selection.

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Copy the selected text to the tmux buffer and local terminal clipboard.

bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel

# Copy a mouse selection when the mouse button is released.

bind-key -T copy-mode-vi MouseDragEnd1Pane 
send-keys -X copy-selection-and-cancel

