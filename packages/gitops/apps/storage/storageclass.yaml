apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: glusterfs
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
# TODO: Replace with proper CSI provisioner
# Current: Manual provisioning (deprecated native plugin)
# Target: CSI driver (e.g., kadalu.io or glusterfs.csi.k8s.io)
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
