[package]
name = "webb-app"
version = "0.1.0"
authors = ["Matt Camp <matt@aicampground.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[dependencies]
dioxus = { version = "0.6.3", features = ["router", "web"] }
pango-sys = "0.20.9"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = "^0.7.0"
axum-macros = "^0.4.2"
dioxus-fullstack = "0.6.3"
dioxus-isrg = "0.6.2"
dioxus-liveview = "0.6.2"
dioxus-ssr = "0.6.2"
http-range-header = "0.4.2"
hyper-tls = "0.6.0"
inventory = "0.3.20"
multer = "3.1.0"
rustls-pemfile = "2.2.0"
tokio-tungstenite = "^0.24.0"
tower = "^0.4.13"
tower-http = "^0.5.2"
tracing-futures = "0.2.5"
