# Dynamic GlusterFS StorageClass
# Replaces the static glusterfs StorageClass with dynamic provisioning

apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: glusterfs-dynamic
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: gluster.org/glusterfs-simple
parameters:
  forceCreate: "true"
  volumeType: "replicate:2"

  # GlusterFS cluster configuration
  glusterfsCluster: "glusterfs-cluster"
  glusterfsNamespace: "glusterfs-storage"

reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
