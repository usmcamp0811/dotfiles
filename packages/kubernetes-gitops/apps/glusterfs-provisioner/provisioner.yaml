# GlusterFS Dynamic Provisioner
# Based on gluster/glusterfs-simple-provisioner

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: glusterfs-provisioner
  namespace: glusterfs-storage

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: glusterfs-provisioner
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "update", "patch"]
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: glusterfs-provisioner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: glusterfs-provisioner
subjects:
  - kind: ServiceAccount
    name: glusterfs-provisioner
    namespace: glusterfs-storage

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glusterfs-provisioner
  namespace: glusterfs-storage
  labels:
    app: glusterfs-provisioner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: glusterfs-provisioner
  template:
    metadata:
      labels:
        app: glusterfs-provisioner
    spec:
      serviceAccountName: glusterfs-provisioner
      containers:
        - name: glusterfs-provisioner
          image: quay.io/external_storage/glusterfs-simple-provisioner:latest
          env:
            - name: PROVISIONER_NAME
              value: gluster.org/glusterfs-simple
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
