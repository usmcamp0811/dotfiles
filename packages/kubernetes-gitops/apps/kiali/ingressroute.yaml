apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kiali
  namespace: istio-system
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`istio.k8s.aicampground.com`)
    services:
    - name: kiali
      port: 20001
  tls:
    certResolver: cloudflare  # CRITICAL: Changed from 'letsencrypt' to 'cloudflare'
