# /config/packages/kubernetes-gitops/apps/kiali/externalsecret-kiali-oidc.yaml
# ExternalSecret: pulls OIDC_CLIENT_SECRET from Vault and materializes the
# Kubernetes Secret that Kiali expects (name: kiali, key: oidc-secret).

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kiali-oidc
  namespace: istio-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore

  target:
    name: kiali
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        oidc-secret: "{{ .OIDC_CLIENT_SECRET }}"

  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: kiali
        property: OIDC_CLIENT_SECRET
