# Kiali Helm Chart Values
# Location in GitLab: packages/kubernetes-gitops/apps/kiali/values.yaml

auth:
  strategy: anonymous  # Use anonymous - Kiali uses its service account for K8s API

server:
  web_fqdn: istio.k8s.aicampground.com
  web_root: /
  web_schema: https

deployment:
  logger:
    log_level: info
    log_format: text
    sampler_rate: "1"
    time_field_format: 2006-01-02T15:04:05Z07:00

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

external_services:
  prometheus:
    url: http://prometheus-kube-prometheus-prometheus.monitoring:9090
  istio:
    root_namespace: istio-system
  grafana:
    enabled: false
  tracing:
    enabled: false

# Optional: Add Authentik SSO protection via Traefik ForwardAuth middleware
# (uncomment and configure if you want SSO in front of anonymous Kiali)
# ingress:
#   annotations:
#     traefik.ingress.kubernetes.io/router.middlewares: authentik-forwardauth@kubernetescrd
