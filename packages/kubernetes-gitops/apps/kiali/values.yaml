# Kiali Helm Values with OIDC via Authentik

auth:
  strategy: openid
  openid:
    client_id: wbf92G5cpQGxRQMSNTih7bhy3Upuu1nFvrh11Qhj # OAuth2 client ID (not a secret)
    issuer_uri: https://auth.aicampground.com/application/o/kiali/
    scopes:
      - openid
      - profile
      - email
    username_claim: preferred_username
    # client_secret is read from KIALI_AUTH_OPENID_CLIENT_SECRET env var (injected via custom_envs below)

server:
  web_fqdn: istio.k8s.aicampground.com
  web_root: /
  web_schema: https

deployment:
  logger:
    log_level: info
    log_format: text
    sampler_rate: "1"
    time_field_format: 2006-01-02T15:04:05Z07:00

  # Inject OIDC credentials from ExternalSecret as environment variables
  custom_secrets:
    - name: kiali-oidc
      mount: /kiali-secret

  custom_envs:
    - name: KIALI_AUTH_OPENID_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: kiali-oidc
          key: KIALI_AUTH_OPENID_CLIENT_ID
    - name: KIALI_AUTH_OPENID_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: kiali-oidc
          key: KIALI_AUTH_OPENID_CLIENT_SECRET

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

external_services:
  prometheus:
    url: http://prometheus-kube-prometheus-prometheus.monitoring:9090
  istio:
    root_namespace: istio-system
  grafana:
    enabled: false
  tracing:
    enabled: false
