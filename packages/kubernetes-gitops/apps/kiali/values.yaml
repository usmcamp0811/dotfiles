# Kiali Helm Values with OIDC via Authentik

auth:
  strategy: openid
  openid:
    client_id: ""  # Leave empty - will be read from env var KIALI_AUTH_OPENID_CLIENT_ID
    client_secret: ""  # Leave empty - will be read from env var KIALI_AUTH_OPENID_CLIENT_SECRET
    issuer_uri: https://auth.aicampground.com/application/o/kiali/
    scopes:
    - openid
    - profile
    - email
    username_claim: preferred_username

server:
  web_fqdn: istio.k8s.aicampground.com
  web_root: /
  web_schema: https

deployment:
  logger:
    log_level: info
    log_format: text
    sampler_rate: "1"
    time_field_format: 2006-01-02T15:04:05Z07:00

  # Inject OIDC credentials from ExternalSecret as environment variables
  custom_secrets:
  - name: kiali-oidc
    mount: /kiali-secret

  custom_envs:
  - name: KIALI_AUTH_OPENID_CLIENT_ID
    valueFrom:
      secretKeyRef:
        name: kiali-oidc
        key: KIALI_AUTH_OPENID_CLIENT_ID
  - name: KIALI_AUTH_OPENID_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: kiali-oidc
        key: KIALI_AUTH_OPENID_CLIENT_SECRET

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

external_services:
  prometheus:
    url: http://prometheus-kube-prometheus-prometheus.monitoring:9090
  istio:
    root_namespace: istio-system
  grafana:
    enabled: false
  tracing:
    enabled: false
