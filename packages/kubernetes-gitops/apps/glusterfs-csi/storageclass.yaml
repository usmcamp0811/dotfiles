piVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: glusterfs-csi
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: gluster.csi.k8s.io
parameters:
  server: GLUSTER_NODE_1_DNS_OR_IP
  share: GLUSTER_VOLUME_NAME
mountOptions:
  # Add additional endpoints for failover/resolution if you want:
  # (format shown in the driver's README)
  - backup-volfile-servers=GLUSTER_NODE_2_DNS_OR_IP:GLUSTER_NODE_3_DNS_OR_IP
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
