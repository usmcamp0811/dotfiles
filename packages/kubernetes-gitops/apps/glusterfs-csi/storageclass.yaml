apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: glusterfs-csi
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: gluster.csi.k8s.io
parameters:
  server: 10.8.0.176
  share: k8s-storage  # Update with your actual GlusterFS volume name
mountOptions:
  - backup-volfile-servers=10.8.0.189
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
