apiVersion: v1
kind: Namespace
metadata:
  name: glusterfs-storage
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: glusterfs-subdir-provisioner
  namespace: glusterfs-storage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: glusterfs-subdir-provisioner
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "update", "patch"]
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: glusterfs-subdir-provisioner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: glusterfs-subdir-provisioner
subjects:
  - kind: ServiceAccount
    name: glusterfs-subdir-provisioner
    namespace: glusterfs-storage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glusterfs-subdir-provisioner
  namespace: glusterfs-storage
  labels:
    app: glusterfs-subdir-provisioner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: glusterfs-subdir-provisioner
  template:
    metadata:
      labels:
        app: glusterfs-subdir-provisioner
    spec:
      serviceAccountName: glusterfs-subdir-provisioner
      containers:
        - name: provisioner
          # Modern maintained subdir provisioner image (OCI/schema2)
          image: registry.k8s.io/sig-storage/nfs-subdir-external-provisioner:v4.0.2
          imagePullPolicy: IfNotPresent
          env:
            - name: PROVISIONER_NAME
              value: glusterfs.storage.k8s.io/subdir
            - name: NFS_SERVER
              value: "GLUSTER_HOST_1"
            - name: NFS_PATH
              value: "/GLUSTER_VOLUME"
          volumeMounts:
            - name: nfs
              mountPath: /persistentvolumes
      volumes:
        - name: nfs
          nfs:
            server: "GLUSTER_HOST_1"
            path: "/GLUSTER_VOLUME"
