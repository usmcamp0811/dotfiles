apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: glusterfs
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"  # Replaced by glusterfs-dynamic
# Static provisioning StorageClass (for pre-created PVs)
# Use glusterfs-dynamic for automatic provisioning
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
