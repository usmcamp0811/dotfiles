apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: netbird-postgres
  namespace: netbird
spec:
  instances: 3  # HA with 3 replicas

  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "256MB"
      effective_cache_size: "1GB"
      maintenance_work_mem: "64MB"
      checkpoint_completion_target: "0.9"
      wal_buffers: "16MB"
      default_statistics_target: "100"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      work_mem: "1310kB"
      min_wal_size: "1GB"
      max_wal_size: "4GB"

  bootstrap:
    initdb:
      database: netbird
      owner: netbird
      secret:
        name: netbird-postgres-credentials

  storage:
    storageClass: nfs-glusterfs
    size: 10Gi

  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

  # Backup configuration
  backup:
    barmanObjectStore:
      destinationPath: "s3://netbird-postgres-backups/"
      s3Credentials:
        accessKeyId:
          name: backup-storage-creds
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: backup-storage-creds
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
        maxParallel: 2
    retentionPolicy: "30d"

  monitoring:
    enablePodMonitor: true

---
apiVersion: v1
kind: Secret
metadata:
  name: netbird-postgres-credentials
  namespace: netbird
type: kubernetes.io/basic-auth
stringData:
  username: netbird
  password: ""  # Will be auto-generated by operator
