# Netbird Helm values
# VPN infrastructure with Authentik OIDC integration

# Management server
management:
  enabled: true
  replicaCount: 1

  # Configure via command-line arguments + JSON config
  podCommand:
    args:
      - --port=80
      - --log-file=console
      - --log-level=info
      - --disable-anonymous-metrics=false
      - --single-account-mode-domain=netbird.aicampground.com
      - --dns-domain=dns.netbird.aicampground.com

  # Provide valid management.json configuration
  configmap: |
    {
      "Stuns": [
        {
          "Proto": "udp",
          "URI": "stun:stun.netbird.io:3478",
          "Username": "",
          "Password": null
        }
      ],
      "TURNConfig": {
        "Turns": [
          {
            "Proto": "udp",
            "URI": "turn:turn.netbird.aicampground.com:3478",
            "Username": "netbird",
            "Password": ""
          }
        ],
        "CredentialsTTL": "12h",
        "Secret": "netbird-turn-secret",
        "TimeBasedCredentials": false
      },
      "Signal": {
        "Proto": "http",
        "URI": "10.8.40.101:10000",
        "Username": "",
        "Password": null
      },
      "Datadir": "/var/lib/netbird",
      "DataStoreEncryptionKey": "",
      "StoreConfig": {
        "Engine": "sqlite"
      },
      "HttpConfig": {
        "Address": "0.0.0.0:80",
        "AuthIssuer": "https://auth.aicampground.com/application/o/netbird/",
        "AuthAudience": "cDngatAca7vzV61toEzBSmqQCu7Z8YuhiTFRJH3U",
        "AuthKeysLocation": "https://auth.aicampground.com/application/o/netbird/jwks/",
        "AuthUserIDClaim": "sub",
        "OIDCConfigEndpoint": "https://auth.aicampground.com/application/o/netbird/.well-known/openid-configuration"
      },
      "IdpManagerConfig": {
        "ManagerType": "authentik",
        "ClientConfig": {
          "Issuer": "https://auth.aicampground.com/application/o/netbird/",
          "ClientID": "cDngatAca7vzV61toEzBSmqQCu7Z8YuhiTFRJH3U",
          "ClientSecret": "",
          "TokenEndpoint": "https://auth.aicampground.com/application/o/token/",
          "GrantType": "client_credentials"
        },
        "Auth0ClientCredentials": null,
        "AzureClientCredentials": null,
        "KeycloakClientCredentials": null,
        "ZitadelClientCredentials": null,
        "ExtraConfig": {
          "Username": "NetBird",
          "Password": ""
        }
      },
      "PKCEAuthorizationFlow": {
        "ProviderConfig": {
          "Audience": "cDngatAca7vzV61toEzBSmqQCu7Z8YuhiTFRJH3U",
          "ClientID": "cDngatAca7vzV61toEzBSmqQCu7Z8YuhiTFRJH3U",
          "ClientSecret": "",
          "TokenEndpoint": "https://auth.aicampground.com/application/o/token/",
          "AuthorizationEndpoint": "https://auth.aicampground.com/application/o/authorize/",
          "Scope": "openid profile email offline_access api",
          "RedirectURLs": [
            "http://localhost:53000"
          ],
          "UseIDToken": false
        }
      },
      "DeviceAuthorizationFlow": null
    }

  image:
    repository: netbirdio/management
    tag: latest
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  service:
    type: ClusterIP
    port: 80

  serviceGrpc:
    type: LoadBalancer
    port: 33073
    annotations:
      metallb.universe.tf/allow-shared-ip: "netbird-public"
      metallb.universe.tf/loadBalancerIPs: "10.8.40.101"  # Share same IP as management

  metrics:
    enabled: true
    port: 9090

  persistentVolume:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 1Gi
    storageClass: nfs-glusterfs

  # Disable ingress - use dedicated LoadBalancer instead
  ingress:
    enabled: false

  service:
    type: LoadBalancer
    port: 443
    annotations:
      metallb.universe.tf/allow-shared-ip: "netbird-public"
      metallb.universe.tf/loadBalancerIPs: "10.8.40.101"  # Dedicated IP for Netbird HTTPS

  # Disable GRPC ingress - using LoadBalancer
  ingressGrpc:
    enabled: false

# Signal server
signal:
  enabled: true
  replicaCount: 1

  image:
    repository: netbirdio/signal
    tag: latest
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  service:
    type: LoadBalancer
    port: 10000
    annotations:
      metallb.universe.tf/allow-shared-ip: "netbird-public"
      metallb.universe.tf/loadBalancerIPs: "10.8.40.101"  # Share same IP

  # Disable ingress - using LoadBalancer
  ingress:
    enabled: false

# Dashboard (UI)
ui:
  enabled: true
  replicaCount: 1

  image:
    repository: netbirdio/dashboard
    tag: latest
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  service:
    type: LoadBalancer
    port: 80
    annotations:
      metallb.universe.tf/allow-shared-ip: "netbird-public"
      metallb.universe.tf/loadBalancerIPs: "10.8.40.101"  # Share same IP

  # Dashboard environment configuration
  env:
    NETBIRD_MGMT_API_ENDPOINT: "https://netbird.aicampground.com"
    NETBIRD_MGMT_GRPC_API_ENDPOINT: "https://netbird.aicampground.com:33073"
    AUTH_AUTHORITY: "https://auth.aicampground.com/application/o/netbird/"
    AUTH_CLIENT_ID: "cDngatAca7vzV61toEzBSmqQCu7Z8YuhiTFRJH3U"
    AUTH_SUPPORTED_SCOPES: "openid profile email offline_access api"
    USE_AUTH0: "false"
    AUTH_AUDIENCE: "cDngatAca7vzV61toEzBSmqQCu7Z8YuhiTFRJH3U"
    AUTH_REDIRECT_URI: "https://netbird.aicampground.com"
    AUTH_SILENT_REDIRECT_URI: "https://netbird.aicampground.com/silent-auth"

  # Disable ingress - using LoadBalancer
  ingress:
    enabled: false

# Coturn (TURN/STUN server)
# Needs LoadBalancer for UDP - can't use Traefik for UDP
relay:
  enabled: true
  replicaCount: 1

  image:
    repository: coturn/coturn
    tag: latest
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  service:
    type: LoadBalancer
    port: 3478
    protocol: UDP
    annotations:
      metallb.universe.tf/allow-shared-ip: "netbird-coturn"
      metallb.universe.tf/loadBalancerIPs: "10.8.40.102"  # Separate IP for UDP

  # Coturn configuration
  env:
    TURN_REALM: "turn.netbird.aicampground.com"
    TURN_EXTERNAL_IP: ""  # Will be auto-detected from LoadBalancer IP

# Service Monitor for Prometheus
serviceMonitor:
  enabled: true
  labels:
    release: prometheus
  interval: 30s
