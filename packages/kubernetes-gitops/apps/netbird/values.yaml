# Netbird Helm values
# VPN infrastructure with Authentik OIDC integration

# Management server
management:
  enabled: true
  replicaCount: 1

  # Configure via command-line arguments (not JSON config file)
  podCommand:
    args:
      - --port=80
      - --log-file=console
      - --log-level=info
      - --disable-anonymous-metrics=false
      - --single-account-mode-domain=netbird.aicampground.com
      - --dns-domain=dns.netbird.aicampground.com

  image:
    repository: netbirdio/management
    tag: latest
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  service:
    type: ClusterIP
    port: 80

  serviceGrpc:
    type: ClusterIP
    port: 33073

  metrics:
    enabled: true
    port: 9090

  persistentVolume:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 1Gi
    storageClass: nfs-glusterfs

  ingress:
    enabled: true
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    hosts:
      - host: netbird.k8s.aicampground.com  # Internal K8s hostname
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: netbird-management-tls
        hosts:
          - netbird.k8s.aicampground.com

  service:
    type: ClusterIP
    port: 80

  ingressGrpc:
    enabled: true
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    hosts:
      - host: netbird.k8s.aicampground.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: netbird-management-grpc-tls
        hosts:
          - netbird.k8s.aicampground.com

# Signal server
signal:
  enabled: true
  replicaCount: 1

  image:
    repository: netbirdio/signal
    tag: latest
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  service:
    type: ClusterIP
    port: 80

  ingress:
    enabled: true
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    hosts:
      - host: netbird.k8s.aicampground.com
        paths:
          - path: /signalexchange.SignalExchange
            pathType: Prefix
    tls:
      - secretName: netbird-signal-tls
        hosts:
          - netbird.k8s.aicampground.com

# Dashboard (UI)
ui:
  enabled: true
  replicaCount: 1

  image:
    repository: netbirdio/dashboard
    tag: latest
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  service:
    type: ClusterIP
    port: 80

  # Dashboard environment configuration
  env:
    NETBIRD_MGMT_API_ENDPOINT: "https://netbird.aicampground.com"  # Public URL (via pub-traefik proxy)
    NETBIRD_MGMT_GRPC_API_ENDPOINT: "https://netbird.aicampground.com"
    AUTH_AUTHORITY: "https://auth.aicampground.com/application/o/netbird/"
    AUTH_CLIENT_ID: "cDngatAca7vzV61toEzBSmqQCu7Z8YuhiTFRJH3U"
    AUTH_SUPPORTED_SCOPES: "openid profile email offline_access api"
    USE_AUTH0: "false"
    AUTH_AUDIENCE: "cDngatAca7vzV61toEzBSmqQCu7Z8YuhiTFRJH3U"
    AUTH_REDIRECT_URI: "https://netbird.aicampground.com"  # Public URL
    AUTH_SILENT_REDIRECT_URI: "https://netbird.aicampground.com/silent-auth"

  ingress:
    enabled: true
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    hosts:
      - host: netbird.k8s.aicampground.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: netbird-ui-tls
        hosts:
          - netbird.k8s.aicampground.com

# Coturn (TURN/STUN server)
# Needs LoadBalancer for UDP - can't use Traefik for UDP
relay:
  enabled: true
  replicaCount: 1

  image:
    repository: coturn/coturn
    tag: latest
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  service:
    type: LoadBalancer
    port: 3478
    protocol: UDP
    # MetalLB will assign an IP from your pool
    annotations:
      metallb.universe.tf/allow-shared-ip: "netbird-coturn"

  # Coturn configuration
  env:
    TURN_REALM: "turn.netbird.aicampground.com"
    TURN_EXTERNAL_IP: ""  # Will be auto-detected from LoadBalancer IP

# Service Monitor for Prometheus
serviceMonitor:
  enabled: true
  labels:
    release: prometheus
  interval: 30s
