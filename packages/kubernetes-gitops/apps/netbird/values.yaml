# Netbird Helm values
# VPN infrastructure with Authentik OIDC integration

# Management server
management:
  enabled: true
  replicaCount: 1

  # Point to writable config on persistent volume
  podCommand:
    args:
      - --port=80
      - --log-file=console
      - --log-level=info
      - --disable-anonymous-metrics=false
      - --single-account-mode-domain=netbird.aicampground.com
      - --dns-domain=dns.netbird.aicampground.com
      - --config=/var/lib/netbird/management.json

  # Seed config - will be copied to writable location by lifecycle hook
  configmap: |
    {
      "Datadir": "/var/lib/netbird",
      "StoreConfig": {
        "Engine": "postgres"
      },
      "HttpConfig": {
        "OIDCConfigEndpoint": "https://auth.aicampground.com/application/o/netbird/.well-known/openid-configuration"
      }
    }

  # Copy config from read-only ConfigMap to writable PV on first boot
  lifecycle:
    postStart:
      exec:
        command:
          - /bin/sh
          - -c
          - |
            if [ ! -f /var/lib/netbird/management.json ]; then
              cp /etc/netbird/management.json /var/lib/netbird/management.json
              chmod 644 /var/lib/netbird/management.json
            fi

  # Use environment variables for PostgreSQL connection
  envRaw:
    - name: NETBIRD_STORE_ENGINE_POSTGRES_DSN
      valueFrom:
        secretKeyRef:
          name: netbird-postgres-app
          key: uri
    # Correct env var name for datastore encryption key
    - name: NETBIRD_DATASTORE_ENC_KEY
      valueFrom:
        secretKeyRef:
          name: netbird-secrets
          key: data_store_encryption_key
    - name: NB_AUTH_AUDIENCE
      value: "cDngatAca7vzV61toEzBSmqQCu7Z8YuhiTFRJH3U"
    - name: NB_AUTH_USER_ID_CLAIM
      value: "sub"

  image:
    repository: netbirdio/management
    tag: latest
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  service:
    type: ClusterIP
    port: 80

  serviceGrpc:
    type: LoadBalancer
    port: 33073
    annotations:
      metallb.universe.tf/allow-shared-ip: "netbird-public"
      metallb.universe.tf/loadBalancerIPs: "10.8.40.101"  # Share same IP as management

  metrics:
    enabled: true
    port: 9090

  persistentVolume:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 1Gi
    storageClass: nfs-glusterfs


  # Disable ingress - use dedicated LoadBalancer instead
  ingress:
    enabled: false

  service:
    type: LoadBalancer
    port: 80  # Match container port (no TLS termination at pod level)
    annotations:
      metallb.universe.tf/allow-shared-ip: "netbird-public"
      metallb.universe.tf/loadBalancerIPs: "10.8.40.101"  # Dedicated IP for Netbird HTTPS

  # Disable GRPC ingress - using LoadBalancer
  ingressGrpc:
    enabled: false

# Signal server
signal:
  enabled: true
  replicaCount: 1

  image:
    repository: netbirdio/signal
    tag: latest
    pullPolicy: IfNotPresent

  # Container port configuration - match the --port arg
  podCommand:
    args:
      - --port=10000
      - --log-level=info
      - --log-file=console

  # Override container ports to match actual service port
  ports:
    - name: grpc
      containerPort: 10000
      protocol: TCP
    - name: metrics
      containerPort: 9090
      protocol: TCP

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  service:
    type: LoadBalancer
    port: 10000
    annotations:
      metallb.universe.tf/allow-shared-ip: "netbird-public"
      metallb.universe.tf/loadBalancerIPs: "10.8.40.101"  # Share same IP

  # Disable ingress - using LoadBalancer
  ingress:
    enabled: false

# Dashboard (UI)
ui:
  enabled: true
  replicaCount: 1

  image:
    repository: netbirdio/dashboard
    tag: latest
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  service:
    type: LoadBalancer
    port: 80
    annotations:
      metallb.universe.tf/allow-shared-ip: "netbird-public"
      metallb.universe.tf/loadBalancerIPs: "10.8.40.101"  # Share same IP

  # Dashboard environment configuration
  env:
    NETBIRD_MGMT_API_ENDPOINT: "https://netbird.aicampground.com"
    NETBIRD_MGMT_GRPC_API_ENDPOINT: "https://netbird.aicampground.com:33073"
    AUTH_AUTHORITY: "https://auth.aicampground.com/application/o/netbird/"
    AUTH_CLIENT_ID: "cDngatAca7vzV61toEzBSmqQCu7Z8YuhiTFRJH3U"
    AUTH_SUPPORTED_SCOPES: "openid profile email offline_access api"
    USE_AUTH0: "false"
    AUTH_AUDIENCE: "cDngatAca7vzV61toEzBSmqQCu7Z8YuhiTFRJH3U"
    AUTH_REDIRECT_URI: "https://netbird.aicampground.com"
    AUTH_SILENT_REDIRECT_URI: "https://netbird.aicampground.com/silent-auth"

  # Disable ingress - using LoadBalancer
  ingress:
    enabled: false

# Coturn (TURN/STUN server)
# Needs LoadBalancer for UDP - can't use Traefik for UDP
relay:
  enabled: true
  replicaCount: 1

  image:
    repository: coturn/coturn
    tag: latest
    pullPolicy: IfNotPresent

  # Override container ports - coturn uses 3478 for TURN/STUN, not 33080
  ports:
    - name: turn-udp
      containerPort: 3478
      protocol: UDP
    - name: turn-tcp
      containerPort: 3478
      protocol: TCP

  # Custom probes - coturn doesn't have HTTP endpoint, use UDP socket check
  # Use exec probe to check if turnserver process is running
  livenessProbe:
    exec:
      command:
        - /bin/sh
        - -c
        - "pgrep -x turnserver"
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    exec:
      command:
        - /bin/sh
        - -c
        - "pgrep -x turnserver"
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  service:
    type: LoadBalancer
    port: 3478
    protocol: UDP
    annotations:
      metallb.universe.tf/allow-shared-ip: "netbird-coturn"
      metallb.universe.tf/loadBalancerIPs: "10.8.40.102"  # Separate IP for UDP

  # Coturn configuration
  env:
    TURN_REALM: "turn.netbird.aicampground.com"
    TURN_EXTERNAL_IP: ""  # Will be auto-detected from LoadBalancer IP

# Service Monitor for Prometheus
serviceMonitor:
  enabled: true
  labels:
    release: prometheus
  interval: 30s
