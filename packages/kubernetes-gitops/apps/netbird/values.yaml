# Netbird Helm values
# VPN infrastructure with Authentik OIDC integration
#
# LoadBalancer Configuration (Standalone Mode):
# - 10.8.40.101: All TCP services (shared IP with multiple ports)
#   - Port 80: Management HTTP API
#   - Port 33073: Management gRPC API
#   - Port 443: Dashboard UI
#   - Port 10000: Signal server
# - 10.8.40.102: Coturn TURN/STUN (UDP port 3478)
#
# External Proxy Configuration:
# Point your external proxy/firewall to 10.8.40.101 and port forward:
# - 443 → 10.8.40.101:443 (Dashboard HTTPS)
# - 33073 → 10.8.40.101:33073 (gRPC API)
# - 10000 → 10.8.40.101:10000 (Signal)
# - 3478 → 10.8.40.102:3478 (TURN/STUN UDP)

# Management server
management:
  enabled: true
  replicaCount: 1

  # Point to writable config on persistent volume
  podCommand:
    args:
      - --port=80
      - --log-file=console
      - --log-level=info
      - --disable-anonymous-metrics=false
      - --single-account-mode-domain=netbird-api.aicampground.com
      - --dns-domain=dns.netbird.aicampground.com
      - --config=/var/lib/netbird/management.json

  # Seed config - will be copied to writable location by lifecycle hook
  configmap: |
    {
      "Datadir": "/var/lib/netbird",
      "StoreConfig": {
        "Engine": "postgres"
      },
      "HttpConfig": {
        "OIDCConfigEndpoint": "https://auth.aicampground.com/application/o/netbird/.well-known/openid-configuration",
        "AuthAudience": "cDngatAca7vzV61toEzBSmqQCu7Z8YuhiTFRJH3U",
        "AuthUserIDClaim": "sub",
        "AuthIssuer": "https://auth.aicampground.com/application/o/netbird/",
        "AuthKeysLocation": "https://auth.aicampground.com/application/o/netbird/jwks/"
      },
      "IdpManagerConfig": {
        "ManagerType": "authentik",
        "ClientConfig": {
          "Issuer": "https://auth.aicampground.com/application/o/netbird/",
          "ClientID": "cDngatAca7vzV61toEzBSmqQCu7Z8YuhiTFRJH3U",
          "TokenEndpoint": "https://auth.aicampground.com/application/o/token/",
          "ClientSecret": ""
        },
        "ExtraConfig": {
          "Username": "NetBird"
        }
      }
    }

  # Config initialization handled by separate initContainer patch
  # See management-initcontainer-patch.yaml

  # Use environment variables for PostgreSQL connection
  envRaw:
    - name: NETBIRD_STORE_ENGINE_POSTGRES_DSN
      valueFrom:
        secretKeyRef:
          name: netbird-postgres-app
          key: uri
    # Correct env var name for datastore encryption key
    - name: NETBIRD_DATASTORE_ENC_KEY
      valueFrom:
        secretKeyRef:
          name: netbird-secrets
          key: data_store_encryption_key
    # IDP Manager password for Authentik service account sync
    - name: IDP_MANAGER_PASSWORD
      valueFrom:
        secretKeyRef:
          name: netbird-secrets
          key: IDP_MANAGER_PASSWORD
    - name: NB_AUTH_AUDIENCE
      value: "cDngatAca7vzV61toEzBSmqQCu7Z8YuhiTFRJH3U"
    - name: NB_AUTH_USER_ID_CLAIM
      value: "sub"

  image:
    repository: netbirdio/management
    tag: latest
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # HTTP API service - LoadBalancer on port 80
  service:
    type: LoadBalancer
    port: 80  # Management HTTP API
    annotations:
      metallb.universe.tf/allow-shared-ip: "netbird-public"
      metallb.universe.tf/loadBalancerIPs: "10.8.40.101"  # Shared IP for all Netbird services

  # gRPC API service - LoadBalancer on port 33073
  serviceGrpc:
    type: LoadBalancer
    port: 33073  # Management gRPC API
    annotations:
      metallb.universe.tf/allow-shared-ip: "netbird-public"
      metallb.universe.tf/loadBalancerIPs: "10.8.40.101"  # Share same IP

  metrics:
    enabled: true
    port: 9090

  persistentVolume:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 1Gi
    storageClass: nfs-glusterfs

  # Disable ingress - use dedicated LoadBalancer instead
  ingress:
    enabled: false

  # Disable GRPC ingress - using LoadBalancer
  ingressGrpc:
    enabled: false

# Signal server
signal:
  enabled: true
  replicaCount: 1

  image:
    repository: netbirdio/signal
    tag: latest
    pullPolicy: IfNotPresent

  # Set container port to match service port (10000)
  containerPort: 10000

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # Signal service - LoadBalancer on port 10000
  service:
    type: LoadBalancer
    port: 10000  # Signal protocol
    annotations:
      metallb.universe.tf/allow-shared-ip: "netbird-public"
      metallb.universe.tf/loadBalancerIPs: "10.8.40.101"  # Share same IP with other services

  # Disable ingress - using LoadBalancer
  ingress:
    enabled: false

# Dashboard (UI)
dashboard:
  enabled: true
  replicaCount: 1

  image:
    repository: netbirdio/dashboard
    tag: latest
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # Dashboard HTTP service - LoadBalancer on port 8080
  service:
    type: LoadBalancer
    port: 8080  # Dashboard UI (port 80 already used by management service)
    annotations:
      metallb.universe.tf/allow-shared-ip: "netbird-public"
      metallb.universe.tf/loadBalancerIPs: "10.8.40.101"  # Share same IP with other services

  # Dashboard environment configuration
  env:
    # Management API endpoint - separate hostname from dashboard
    # The management server runs both HTTP and gRPC on the same port (80)
    NETBIRD_MGMT_API_ENDPOINT: "https://netbird-api.aicampground.com"
    NETBIRD_MGMT_GRPC_API_ENDPOINT: "https://netbird-api.aicampground.com"
    # Dashboard URL - used for building OAuth redirect URIs
    NETBIRD_DASHBOARD_URL: "https://netbird.aicampground.com"
    AUTH_AUTHORITY: "https://auth.aicampground.com/application/o/netbird/"
    AUTH_CLIENT_ID: "cDngatAca7vzV61toEzBSmqQCu7Z8YuhiTFRJH3U"
    AUTH_SUPPORTED_SCOPES: "openid profile email offline_access api"
    USE_AUTH0: "false"
    AUTH_AUDIENCE: "cDngatAca7vzV61toEzBSmqQCu7Z8YuhiTFRJH3U"
    # AUTH_REDIRECT_URI should be relative paths when NETBIRD_DASHBOARD_URL is set
    AUTH_REDIRECT_URI: "/"
    AUTH_SILENT_REDIRECT_URI: "/silent-auth"

  # Disable ingress - using LoadBalancer
  ingress:
    enabled: false

# Coturn (TURN/STUN server)
# Needs separate LoadBalancer IP for UDP traffic
relay:
  enabled: true
  replicaCount: 1

  image:
    repository: coturn/coturn
    tag: latest
    pullPolicy: IfNotPresent

  # Set container port to 3478 (TURN/STUN default)
  containerPort: 3478

  # Disable probes - coturn doesn't provide HTTP endpoints
  # The service runs continuously without needing health checks
  livenessProbe: {}
  readinessProbe: {}

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Coturn service - Separate LoadBalancer for UDP on port 3478
  service:
    type: LoadBalancer
    port: 3478  # TURN/STUN UDP
    protocol: UDP
    annotations:
      metallb.universe.tf/allow-shared-ip: "netbird-coturn"
      metallb.universe.tf/loadBalancerIPs: "10.8.40.102"  # Separate IP for UDP traffic

  # Coturn configuration
  env:
    TURN_REALM: "turn.netbird.aicampground.com"
    TURN_EXTERNAL_IP: ""  # Will be auto-detected from LoadBalancer IP

# Service Monitor for Prometheus
serviceMonitor:
  enabled: true
  labels:
    release: prometheus
  interval: 30s
