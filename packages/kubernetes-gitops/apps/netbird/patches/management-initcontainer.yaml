apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbird-management
  namespace: netbird
spec:
  # REQUIRED for apps/v1 Deployments
  selector:
    matchLabels:
      app: netbird-management

  template:
    metadata:
      labels:
        app: netbird-management
    spec:
      initContainers:
        - name: inject-idp-password
          image: python:3.12-alpine
          command:
            - sh
            - -c
            - |
              set -euo pipefail
              echo "Preparing management config with IDP password..."

              # Copy base config from ConfigMap-mounted file
              cp /etc/netbird/management.json /var/lib/netbird/management.json

              # JSON-escape password, then replace placeholder in file contents
              python - <<'PY'
              import os, json
              path = "/var/lib/netbird/management.json"
              pw = os.environ.get("IDP_MANAGER_PASSWORD")
              if not pw:
                  raise SystemExit("ERROR: IDP_MANAGER_PASSWORD not set!")

              with open(path, "r", encoding="utf-8") as f:
                  txt = f.read()

              esc = json.dumps(pw)[1:-1]  # json-escaped string content (no surrounding quotes)

              if "PLACEHOLDER_IDP_PASSWORD" not in txt:
                  raise SystemExit("ERROR: Placeholder PLACEHOLDER_IDP_PASSWORD not found in management.json")

              txt = txt.replace("PLACEHOLDER_IDP_PASSWORD", esc)

              with open(path, "w", encoding="utf-8") as f:
                  f.write(txt)
              PY

              chmod 0644 /var/lib/netbird/management.json
              echo "Config ready"
          env:
            - name: IDP_MANAGER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: netbird-secrets
                  key: IDP_MANAGER_PASSWORD
          volumeMounts:
            - name: config
              mountPath: /etc/netbird
              readOnly: true
            - name: management
              mountPath: /var/lib/netbird

      # IMPORTANT: your main netbird-management container must ALSO mount `management`
      # at /var/lib/netbird so it reads the injected /var/lib/netbird/management.json.
      #
      # containers:
      #   - name: netbird-management
      #     image: <your-image>
      #     volumeMounts:
      #       - name: management
      #         mountPath: /var/lib/netbird
