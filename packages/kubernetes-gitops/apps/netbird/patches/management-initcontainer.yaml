apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbird-management
  namespace: netbird
spec:
  template:
    spec:
      initContainers:
        - name: inject-idp-password
          image: python:3.12-alpine
          command:
            - sh
            - -c
            - |
              set -euo pipefail
              echo "Preparing management config with IDP password..."

              # Copy base config from ConfigMap-mounted file
              cp /etc/netbird/management.json /var/lib/netbird/management.json

              # JSON-escape password and add encryption key
              python - <<'PY'
              import os, json
              path = "/var/lib/netbird/management.json"
              pw = os.environ.get("IDP_MANAGER_PASSWORD")
              enc_key = os.environ.get("NETBIRD_DATASTORE_ENC_KEY")

              if not pw:
                  raise SystemExit("ERROR: IDP_MANAGER_PASSWORD not set!")
              if not enc_key:
                  raise SystemExit("ERROR: NETBIRD_DATASTORE_ENC_KEY not set!")

              with open(path, "r", encoding="utf-8") as f:
                  config = json.load(f)

              # Replace IDP password in nested config
              # Password is already properly escaped by json.dump()
              if "IdpManagerConfig" in config and "ExtraConfig" in config["IdpManagerConfig"]:
                  config["IdpManagerConfig"]["ExtraConfig"]["Password"] = pw

              # Set DataStoreEncryptionKey to prevent auto-generation
              config["DataStoreEncryptionKey"] = enc_key

              # Write with ensure_ascii=True to properly escape special chars
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(config, f, indent=2, ensure_ascii=True)
              PY

              chmod 0644 /var/lib/netbird/management.json
              echo "Config ready"
          env:
            - name: IDP_MANAGER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: netbird-secrets
                  key: IDP_MANAGER_PASSWORD
            - name: NETBIRD_DATASTORE_ENC_KEY
              valueFrom:
                secretKeyRef:
                  name: netbird-secrets
                  key: data_store_encryption_key
          volumeMounts:
            - name: config
              mountPath: /etc/netbird
              readOnly: true
            - name: management
              mountPath: /var/lib/netbird
