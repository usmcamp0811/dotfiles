apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: netbird

helmCharts:
  - name: netbird
    releaseName: netbird
    repo: https://netbirdio.github.io/helms
    version: 1.9.0
    namespace: netbird
    valuesFile: values.yaml

resources:
  - external-secret.yaml
  - postgres-cluster.yaml
  - postgres-backup.yaml

patches:
  - path: patches/management-initcontainer.yaml
    target:
      kind: Deployment
      name: netbird-management
