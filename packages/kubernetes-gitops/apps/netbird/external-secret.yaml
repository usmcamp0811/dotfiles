apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: netbird-secrets
  namespace: netbird
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore

  target:
    name: netbird-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Authentik user password for NetBird service account
        netbird_authentik_password: "{{ .authentik_user_password }}"

        # Coturn/TURN secrets
        coturn_secret: "{{ .coturn }}"
        turn_secret: "{{ .turn }}"

        # For management server config
        TURN_PASSWORD: "{{ .coturn }}"
        TURN_SECRET: "{{ .turn }}"
        IDP_MANAGER_PASSWORD: "{{ .authentik_user_password }}"

  data:
    # From Vault path: secret/campground/netbird
    - secretKey: authentik_user_password
      remoteRef:
        key: secret/campground/netbird
        property: authentik_user_password

    - secretKey: coturn
      remoteRef:
        key: secret/campground/netbird
        property: coturn

    - secretKey: turn
      remoteRef:
        key: secret/campground/netbird
        property: turn

    - secretKey: data_store_encryption_key
      remoteRef:
        key: secret/campground/netbird
        property: data_store_encryption_key
