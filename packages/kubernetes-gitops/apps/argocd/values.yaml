# ArgoCD Helm Chart Values
# Self-management configuration for ArgoCD

global:
  domain: argocd.k8s.aicampground.com

# Server configuration
server:
  service:
    type: ClusterIP

  ingress:
    enabled: false  # Using Traefik IngressRoute instead

  # Mount OIDC credentials as environment variables
  envFrom:
    - secretRef:
        name: argocd-authentik-oidc

  config:
    # Repository credentials will be provided via bootstrap secret

# Controller configuration
controller:
  metrics:
    enabled: true

# Dex (SSO) - disabled in favor of Authentik OIDC
dex:
  enabled: false

# Redis configuration
redis:
  enabled: true

# Repo server configuration
repoServer:
  metrics:
    enabled: true

# Application controller
applicationSet:
  enabled: true

# Notifications controller
notifications:
  enabled: false

# Configs
configs:
  params:
    server.insecure: true  # Using Traefik for TLS termination

  cm:
    # Timeout settings
    timeout.reconciliation: 180s
    timeout.hard.reconciliation: 0s

    # OIDC Configuration for Authentik
    url: https://argocd.k8s.aicampground.com
    oidc.config: |
      name: Authentik
      issuer: https://auth.aicampground.com/application/o/argocd/
      clientID: $clientId
      clientSecret: $clientSecret
      requestedScopes:
        - openid
        - profile
        - email
        - groups
      requestedIDTokenClaims:
        groups:
          essential: true

  secret:
    # ArgoCD will read OIDC credentials from environment variables
    createSecret: false  # We're using vault-agent rendered secret instead

  rbac:
    # Default RBAC policy
    policy.default: role:readonly

    # RBAC policy for Authentik groups
    policy.csv: |
      g, ArgoCD Admins, role:admin
      g, ArgoCD Viewers, role:readonly
