apiVersion: batch/v1
kind: Job
metadata:
  name: scale-down-bootstrap-argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      name: scale-down-bootstrap-argocd
    spec:
      serviceAccountName: argocd-self-application-controller
      restartPolicy: OnFailure
      containers:
        - name: kubectl
          image: bitnami/kubectl:latest
          command:
            - /bin/bash
            - -c
            - |
              set -e

              echo "Waiting for argocd-self-server to be ready..."
              kubectl wait --for=condition=available --timeout=300s deployment/argocd-self-server -n argocd

              echo "argocd-self is ready! Scaling down bootstrap ArgoCD..."

              # Scale down all bootstrap ArgoCD deployments
              if kubectl get namespace argocd-bootstrap >/dev/null 2>&1; then
                echo "Scaling down bootstrap ArgoCD deployments..."
                kubectl scale deployment --all --replicas=0 -n argocd-bootstrap || true
                kubectl scale statefulset --all --replicas=0 -n argocd-bootstrap || true

                echo "Bootstrap ArgoCD scaled down successfully!"
                echo "The argocd-bootstrap namespace can be safely deleted when ready."
              else
                echo "argocd-bootstrap namespace not found, skipping..."
              fi

              echo "Cleanup complete!"
