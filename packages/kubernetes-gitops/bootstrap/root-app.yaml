apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd-bootstrap
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://gitlab.com/usmcamp0811/dotfiles.git # Will be parameterized by Nix
    targetRevision: nixos # Will be parameterized by Nix
    path: packages/kubernetes-gitops/clusters/campground # Will be parameterized by Nix
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd-bootstrap
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
