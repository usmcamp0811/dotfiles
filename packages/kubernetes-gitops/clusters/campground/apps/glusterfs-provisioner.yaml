apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: glusterfs-provisioner
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"  # Deploy early
spec:
  project: platform

  source:
    repoURL: https://gitlab.com/usmcamp0811/dotfiles.git
    targetRevision: nixos
    path: packages/kubernetes-gitops/apps/glusterfs-provisioner

  destination:
    server: https://kubernetes.default.svc
    namespace: glusterfs-storage

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
