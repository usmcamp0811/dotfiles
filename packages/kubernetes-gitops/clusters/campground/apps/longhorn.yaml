apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  sources:
    # Helm chart source
    - repoURL: https://charts.longhorn.io
      chart: longhorn
      targetRevision: 1.8.4  # Intermediate version for upgrade path from 1.7.2
      helm:
        skipCrds: false
        values: |
          persistence:
            defaultClass: false
          defaultSettings:
            defaultDataPath: /var/lib/longhorn
          # Disable pre-upgrade checker for fresh installations
          preUpgradeChecker:
            jobEnabled: false
          # Ensure CRDs are installed
          crds:
            enabled: true

          # NixOS compatibility: The host-level fmf.services.k3s module creates
          # FHS-compatible symlinks and configures iscsid BindPaths which should
          # handle most nsenter binary resolution issues. This ConfigMap provides
          # the NixOS PATH as a fallback/reference.
          # See: https://github.com/longhorn/longhorn/issues/2166
    # Manifests source (StorageClass + NixOS ConfigMap)
    - repoURL: https://gitlab.com/usmcamp0811/dotfiles.git
      targetRevision: nixos
      path: packages/kubernetes-gitops/apps/longhorn
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - Replace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
