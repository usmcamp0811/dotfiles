apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: netbird
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"  # After Prometheus and external-secrets
spec:
  project: platform

  source:
    repoURL: https://gitlab.com/usmcamp0811/dotfiles.git
    targetRevision: nixos
    path: packages/kubernetes-gitops/apps/netbird

  destination:
    server: https://kubernetes.default.svc
    namespace: netbird

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
