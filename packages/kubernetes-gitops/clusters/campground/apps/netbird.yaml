apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: netbird
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"  # After Prometheus and external-secrets
spec:
  project: platform

  sources:
    # PostgreSQL cluster and other K8s resources
    - repoURL: https://gitlab.com/usmcamp0811/dotfiles.git
      targetRevision: nixos
      path: packages/kubernetes-gitops/apps/netbird
      directory:
        include: "*.yaml"
        exclude: "values.yaml"

    # Helm chart
    - repoURL: https://netbirdio.github.io/helms
      chart: netbird
      targetRevision: 1.9.0  # Latest stable (app version 0.46.0)
      helm:
        valueFiles:
          - $values/packages/kubernetes-gitops/apps/netbird/values.yaml

    # Values ref
    - repoURL: https://gitlab.com/usmcamp0811/dotfiles.git
      targetRevision: nixos
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: netbird

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
