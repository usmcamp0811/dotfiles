apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spark-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"  # After storage, before apps
spec:
  project: platform

  source:
    repoURL: https://kubeflow.github.io/spark-operator
    chart: spark-operator
    targetRevision: 2.4.0  # Latest stable (app version 2.4.0)
    helm:
      values: |
        # Image configuration
        image:
          registry: ghcr.io
          repository: kubeflow/spark-operator/controller
          tag: ""  # Use chart appVersion (2.4.0)
          pullPolicy: IfNotPresent

        # Controller configuration
        controller:
          replicas: 1
          workers: 10  # Reconcile concurrency
          logLevel: info
          logEncoder: console

          # Leader election
          leaderElection:
            enable: true
            leaseDuration: 15s
            renewDeadline: 10s
            retryPeriod: 2s

          # Spark UI service
          uiService:
            enable: true

          # Resource limits
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

        # Webhook configuration
        webhook:
          enable: true
          port: 9443

        # Prometheus metrics
        prometheus:
          metrics:
            enable: true
            port: 8080
            endpoint: /metrics
          podMonitor:
            enable: true
            labels:
              release: prometheus  # Match prometheus serviceMonitorSelector

        # Limit operator to specific namespace (optional)
        # sparkJobNamespace: spark-jobs

  destination:
    server: https://kubernetes.default.svc
    namespace: spark-operator

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
