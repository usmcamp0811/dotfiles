apiVersion: v1
kind: Namespace
metadata:
  name: glusterfs-storage
---
apiVersion: v1
kind: Service
metadata:
  name: glusterfs-cluster
  namespace: glusterfs-storage
spec:
  ports:
    - name: glusterfs
      port: 1
      targetPort: 1
---
apiVersion: v1
kind: Endpoints
metadata:
  name: glusterfs-cluster
  namespace: glusterfs-storage
subsets:
  - addresses:
      - ip: GLUSTER_NODE_1_IP
      - ip: GLUSTER_NODE_2_IP
      - ip: GLUSTER_NODE_3_IP
    ports:
      - name: glusterfs
        port: 1
