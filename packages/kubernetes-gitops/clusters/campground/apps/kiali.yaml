apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kiali
  namespace: argocd-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "4" # Install after istiod
spec:
  project: platform

  sources:
    # Helm chart
    - repoURL: https://kiali.org/helm-charts
      chart: kiali-server
      targetRevision: 2.2.0 # Latest Kiali version
      helm:
        valueFiles:
          - $values/packages/kubernetes-gitops/apps/kiali/values.yaml

    # Values ref for $values/...
    - repoURL: https://gitlab.com/usmcamp0811/dotfiles.git
      targetRevision: nixos
      ref: values

    # Manifests (ExternalSecret for OIDC)
    - repoURL: https://gitlab.com/usmcamp0811/dotfiles.git
      targetRevision: nixos
      path: packages/kubernetes-gitops/apps/kiali
      directory:
        recurse: true
        exclude: |
          values.yaml
          **/.gitkeep

  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system

  ignoreDifferences:
    # external-secrets-operator owns status updates
    - group: external-secrets.io
      kind: ExternalSecret
      jsonPointers:
        - /status
        - /metadata/resourceVersion

    # external-secrets-operator owns the Secret metadata; Kiali reads the secret data.
    # IMPORTANT: This MUST match the Secret name ExternalSecret creates.
    # With the recommended Kiali OIDC setup, the Secret is named "kiali" and contains key "oidc-secret".
    - kind: Secret
      name: kiali
      namespace: istio-system
      jsonPointers:
        - /metadata/annotations
        - /metadata/labels
        - /metadata/ownerReferences
        - /metadata/resourceVersion

    # Ignore ConfigMap to prevent ArgoCD/Helm fight
    - kind: ConfigMap
      name: kiali
      namespace: istio-system
      jsonPointers:
        - /metadata/resourceVersion

  syncPolicy:
    automated:
      prune: true
      selfHeal: false  # Disabled due to sync loop issue
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
