apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: platform

  sources:
    # 1) Helm chart source
    - repoURL: https://traefik.github.io/charts
      chart: traefik
      # Updated to a version that actually exists in the repo
      targetRevision: 34.3.0
      helm:
        releaseName: traefik
        valueFiles:
          # Your repo paths in logs look like: packages/kubernetes-gitops/apps/<app>/...
          - $values/packages/kubernetes-gitops/apps/traefik/values.yaml

    # 2) Values repo (used by $values/...)
    - repoURL: https://gitlab.com/usmcamp0811/dotfiles.git
      targetRevision: nixos
      ref: values

    # 3) OPTIONAL: extra manifests (IngressRoutes, Middleware, etc.) from your repo
    # If you don't have extra manifests there, delete this source.
    - repoURL: https://gitlab.com/usmcamp0811/dotfiles.git
      targetRevision: nixos
      path: packages/kubernetes-gitops/apps/traefik

  destination:
    server: https://kubernetes.default.svc
    namespace: traefik-k8s

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
