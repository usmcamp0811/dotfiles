# /config/packages/kubernetes-gitops/clusters/campground/kustomization.yaml

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Argo projects / bootstrap
  - projects/platform-project.yaml

  # Storage
  # - apps/longhorn.yaml
  - apps/nfs-provisioner.yaml

  # Secrets & infra
  - apps/external-secrets.yaml
  - apps/vault-backend.yaml

  # Networking
  - apps/metallb.yaml
  - apps/traefik.yaml

  # Observability
  - apps/prometheus.yaml

  # Database
  - apps/cloudnative-pg.yaml

  # Data Processing
  - apps/spark-operator.yaml

  # Istio
  - apps/istio-base.yaml
  - apps/istiod.yaml
  - apps/kiali.yaml

  # VPN
  - apps/netbird.yaml
