Flask-JWT-Extended = "4.6.0"
Flask-Limiter = "3.8.0"
Flask-Login = "0.6.3"
Flask-SQLAlchemy = "2.5.1"
Flask-Session = "0.5.0"
Flask-WTF = "1.2.1"
Flask = "2.2.5"
GitPython = "3.1.43"
JPype1 = "1.5.0"
JayDeBeApi = "1.2.3"
Jinja2 = "3.1.4"
Js2Py = "0.74"
