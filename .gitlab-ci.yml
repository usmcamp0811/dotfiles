stages:
  - update_flake
  - build_systems
  - deploy

.setup_ssh:
  script:
    - |
      echo "Authenticating with Vault..."
      vault write auth/approle/login role_id="$VAULT_ROLE_ID" secret_id="$VAULT_SECRET_ID"
      export VAULT_TOKEN=$(vault write -field=token auth/approle/login role_id="$VAULT_ROLE_ID" secret_id="$VAULT_SECRET_ID")
      export sshkey=$(vault kv get -field="sshkey" "secret/campground/gitlab-runner")
      mkdir -p ~/.ssh
      eval "$(ssh-agent -s)"
      echo "$sshkey" | ssh-add -

update-flake:
  stage: update_flake
  tags:
    - nix
  script:
    - git rm flake.lock
    - nix flake update
  artifacts:
    paths:
      - flake.lock
    expire_in: 1 hour
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: false

.build_job_template: &build_job_template
  stage: build_systems
  tags:
    - nix
  extends:
    - .setup_ssh
  script:
    - |
      ssh-keyscan reckless >> ~/.ssh/known_hosts
      nix build .#nixosConfigurations.${SYSTEM}.config.system.build.toplevel -j 1
      nix-copy-closure --to root@${SYSTEM} ./result
  needs:
    - job: update-flake
      optional: true  # Makes the dependency on update-flake optional
  resource_group: build_sequential
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "schedule"'
      when: always
      allow_failure: false

butler:
  <<: *build_job_template
  variables:
    SYSTEM: "butler"

daly:
  <<: *build_job_template
  variables:
    SYSTEM: "daly"

lucas:
  <<: *build_job_template
  variables:
    SYSTEM: "lucas"

chesty:
  <<: *build_job_template
  variables:
    SYSTEM: "chesty"

webb:
  <<: *build_job_template
  variables:
    SYSTEM: "webb"

reckless:
  <<: *build_job_template
  variables:
    SYSTEM: "reckless"

.deploy_job_template: &deploy_job_template
  stage: deploy
  tags:
    - nix
  script:
    - |
      echo "Authenticating with Vault..."
      vault write auth/approle/login role_id="$VAULT_ROLE_ID" secret_id="$VAULT_SECRET_ID"
      export VAULT_TOKEN=$(vault write -field=token auth/approle/login role_id="$VAULT_ROLE_ID" secret_id="$VAULT_SECRET_ID")
      eval "$(ssh-agent -s)"
      vault kv get -field="lucas_CI_SERVER_URL" "secret/campground/gitlab-runner"
      sshkey=$(vault kv get -field="sshkey" "secret/campground/gitlab-runner")
      mkdir -p ~/.ssh
      echo "$sshkey" | ssh-add -
    - |
      ssh-keyscan $SYSTEM >> ~/.ssh/known_hosts
      nix run nixpkgs#figlet -- -t -c "$SYSTEM" | nix run nixpkgs#lolcat
      deploy --hostname $SYSTEM .#$SYSTEM
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: false

butler_deploy:
  <<: *deploy_job_template
  variables:
    SYSTEM: "butler"

daly_deploy:
  <<: *deploy_job_template
  variables:
    SYSTEM: "daly"

lucas_deploy:
  <<: *deploy_job_template
  variables:
    SYSTEM: "lucas"

chesty_deploy:
  <<: *deploy_job_template
  variables:
    SYSTEM: "chesty"

webb_deploy:
  <<: *deploy_job_template
  variables:
    SYSTEM: "webb"

reckless_deploy:
  <<: *deploy_job_template
  variables:
    SYSTEM: "reckless"

.deploy_hosting_template: &deploy_hosting_template
  stage: deploy
  script:
    - |
      echo "Authenticating with Vault..."
      vault write auth/approle/login role_id="$VAULT_ROLE_ID" secret_id="$VAULT_SECRET_ID"
      export VAULT_TOKEN=$(vault write -field=token auth/approle/login role_id="$VAULT_ROLE_ID" secret_id="$VAULT_SECRET_ID")
      SYSTEMS=$(get-lan-pub-systems $DEPLOY_TYPE)
      echo $SYSTEMS
      eval "$(ssh-agent -s)"
      vault kv get -field="lucas_CI_SERVER_URL" "secret/campground/gitlab-runner"
      sshkey=$(vault kv get -field="sshkey" "secret/campground/gitlab-runner")
      mkdir -p ~/.ssh

      echo "$sshkey" | ssh-add -
      for SYSTEM in $SYSTEMS; do
        ssh-keyscan $SYSTEM >> ~/.ssh/known_hosts
        nix run nixpkgs#figlet -- -t -c "$SYSTEM" | nix run nixpkgs#lolcat
        deploy --hostname $SYSTEM .#$SYSTEM
      done
  tags:
    - nix

deploy_public_hosting:
  <<: *deploy_hosting_template
  variables:
    DEPLOY_TYPE: "public"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes:
        - "**/public-hosting/default.nix"
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

deploy_lan_hosting:
  <<: *deploy_hosting_template
  variables:
    DEPLOY_TYPE: "lan"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes:
        - "**/lan-hosting/default.nix"
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
