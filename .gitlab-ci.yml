stages:
  - update
  - build
  - hosting

update-flake:
  stage: update
  tags:
    - nix
  script:
    - git rm flake.lock
    - nix flake update
  artifacts:
    paths:
      - flake.lock
    expire_in: 1 hour
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: always

build_job_template: &build_job_template
  stage: build
  tags:
    - nix
  script:
    - nix build .#nixosConfigurations.${SYSTEM}.config.system.build.toplevel -j 1
  needs:
    - update-flake
  resource_group: build_sequential
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: always

# Define systems using build_job_template
butler:
  <<: *build_job_template
  variables:
    SYSTEM: "butler"
# Repeat for each system...

.deploy_template: &deploy_template
  stage: hosting
  tags:
    - nix
  script:
    - >
      nix shell nixpkgs#jq
      if [ "$DEPLOY_TYPE" = "public" ]; then
        SYSTEMS=$(nix eval --json '.#nixosConfigurations' --apply "configurations: (builtins.filter (name: configurations.\${name}.config.campground.suites.public-hosting.enable == true) (builtins.attrNames configurations))" | jq -r '.[]')
      elif [ "$DEPLOY_TYPE" = "lan" ]; then
        SYSTEMS=$(nix eval --json '.#nixosConfigurations' --apply "configurations: (builtins.filter (name: configurations.\${name}.config.campground.suites.lan-hosting.enable == true) (builtins.attrNames configurations))" | jq -r '.[]')
      fi
    - echo $SYSTEMS
    - >
      for SYSTEM in $SYSTEMS; do
        hostname="$SYSTEM"
        kv_path="secret/campground/local-users-passwords"
        vault login -method=approle role_id="./role_id" secret_id="./secret_id" > /dev/null
        password=$(vault kv get -field="$DEPLOY_USER" "$kv_path")
        /usr/bin/env -S nix shell nixpkgs#expect --command expect <<EOF
        set timeout 600
        spawn deploy --interactive-sudo true --hostname $hostname .#$hostname
        expect "(sudo for $hostname) Password:"
        send "$password\r"
        interact
        EOF
      done
  rules:
    - changes:
        - "./modules/nixos/suites/public-hosting/default.nix"
      when: always
# Deploy jobs...

deploy_public:
  <<: *deploy_template
  variables:
    DEPLOY_TYPE: "public"
  rules:
    - changes:
        - "./modules/nixos/suites/public-hosting/default.nix"
      when: always

deploy_lan:
  <<: *deploy_template
  variables:
    DEPLOY_TYPE: "lan"
  rules:
    - changes:
        - "./modules/nixos/suites/lan-hosting/default.nix"
      when: always
