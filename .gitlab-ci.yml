stages:
  - update
  - build

workflow:
  rules:
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: always
    allow_failure: false

update-flake:
  stage: update
  tags:
    - nix
  only:
    - nixos
  script:
    - git rm flake.lock
    - nix flake update
  artifacts:
    paths:
      - flake.lock
    expire_in: 1 hour

build-butler:
  stage: build
  variables:
    SYSTEM: "butler"
  tags:
    - nix
  only:
    - nixos
  script:
    - nix build .#nixosConfigurations.${SYSTEM}.config.system.build.toplevel -j 1;
    - nix run github:zhaofengli/attic\#attic-client push campground ./result
  needs:
    - update-flake
  resource_group: build_sequential

