.deploy_template: &deploy_template
  script:
    - >
      if [ "$DEPLOY_TYPE" = "public" ]; then
        SYSTEMS=$(./ci-scripts/get_lan-public_systems.sh public)
      elif [ "$DEPLOY_TYPE" = "lan" ]; then
        SYSTEMS=$(./ci-scripts/get_lan-public_systems.sh lan)
      fi
    - >
      for SYSTEM in $SYSTEMS; do
        nix build .#nixosConfigurations.${SYSTEM}.config.system.build.toplevel;
        nix-copy-closure --to mcamp@${SYSTEM} ./result;
      done
  tags:
    - linux
    - nix
  only:
    - branches

deploy_public:
  <<: *deploy_template
  variables:
    DEPLOY_TYPE: "public"
  rules:
    - changes:
      - ./modules/nixos/suites/public-hosting/default.nix

deploy_lan:
  <<: *deploy_template
  variables:
    DEPLOY_TYPE: "lan"
  rules:
    - changes:
      - ./modules/nixos/suites/lan-hosting/default.nix
