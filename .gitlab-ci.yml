stages:
  - update
  - build
  - deploy

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: always

update-flake:
  stage: update
  tags:
    - nix
  script:
    - git rm flake.lock
    - nix flake update
  artifacts:
    paths:
      - flake.lock
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == "nixos"'

build_job_template: &build_job_template
  stage: build
  tags:
    - nix
  script:
    - nix build .#nixosConfigurations.${SYSTEM}.config.system.build.toplevel -j 1
  needs:
    - update-flake
  resource_group: build_sequential
  rules:
    - if: '$CI_COMMIT_BRANCH == "nixos"'

butler:
  <<: *build_job_template
  variables:
    SYSTEM: "butler"

daly:
  <<: *build_job_template
  variables:
    SYSTEM: "daly"

lucas:
  <<: *build_job_template
  variables:
    SYSTEM: "lucas"

chesty:
  <<: *build_job_template
  variables:
    SYSTEM: "chesty"

webb:
  <<: *build_job_template
  variables:
    SYSTEM: "webb"

reckless:
  <<: *build_job_template
  variables:
    SYSTEM: "reckless"

.deploy_template: &deploy_template
  stage: deploy
  script:
    - >
      if [ "$DEPLOY_TYPE" = "public" ]; then
        SYSTEMS=$(./ci-scripts/get_lan-public_systems.sh public)
      elif [ "$DEPLOY_TYPE" = "lan" ]; then
        SYSTEMS=$(./ci-scripts/get_lan-public_systems.sh lan)
      fi
    - >
      for SYSTEM in $SYSTEMS; do
        nix build .#nixosConfigurations.${SYSTEM}.config.system.build.toplevel;
        nix-copy-closure --to mcamp@${SYSTEM} ./result;
      done
  tags:
    - linux
    - nix
  rules:
    - changes:
        - ./modules/nixos/suites/$DEPLOY_TYPE-hosting/default.nix

deploy_public:
  <<: *deploy_template
  variables:
    DEPLOY_TYPE: "public"

deploy_lan:
  <<: *deploy_template
  variables:
    DEPLOY_TYPE: "lan"
