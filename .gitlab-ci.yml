stages:
  - setup
  - update
  - build
  - deploy

setup_ssh_and_vault:
  stage: setup
  script:
    - echo "Authenticating with Vault..."
    - vault write auth/approle/login role_id="$VAULT_ROLE_ID" secret_id="$VAULT_SECRET_ID"
    - export VAULT_TOKEN=$(vault write -field=token auth/approle/login role_id="$VAULT_ROLE_ID" secret_id="$VAULT_SECRET_ID")
    - |
      eval "$(ssh-agent -s)"
      sshkey=$(vault kv get -field="sshkey" "secret/campground/gitlab-runner")
      mkdir -p ~/.ssh
      echo "$sshkey" | ssh-add -
    - |
      attic-token=$(vault kv get -field="attic" "secret/campground/gitlab-runner")
      attic login campground https://attic.aicampground.com $attic-token
  tags:
    - nix
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: always

update-flake:
  stage: update
  tags:
    - nix
  script:
    - git rm flake.lock
    - nix flake update
  artifacts:
    paths:
      - flake.lock
    expire_in: 1 hour
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: always
  needs:
    - setup_ssh_and_vault

build_job_template: &build_job_template
  stage: build
  tags:
    - nix
  script:
    - nix build .#nixosConfigurations.${SYSTEM}.config.system.build.toplevel -j 1
    - attic use campground
    - attic push campground ./result
  needs:
    - setup_ssh_and_vault
    - update-flake
  resource_group: build_sequential
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: always

butler:
  <<: *build_job_template
  variables:
    SYSTEM: "butler"

daly:
  <<: *build_job_template
  variables:
    SYSTEM: "daly"

lucas:
  <<: *build_job_template
  variables:
    SYSTEM: "lucas"

chesty:
  <<: *build_job_template
  variables:
    SYSTEM: "chesty"

webb:
  <<: *build_job_template
  variables:
    SYSTEM: "webb"

reckless:
  <<: *build_job_template
  variables:
    SYSTEM: "reckless"

.deploy_template: &deploy_template
  stage: deploy
  resource_group: build_sequential
  script:
    - |
      SYSTEMS=$(get-lan-pub-systems $DEPLOY_TYPE)
      echo $SYSTEMS
      for SYSTEM in $SYSTEMS; do
        ssh-keyscan $SYSTEM >> ~/.ssh/known_hosts
        nix run nixpkgs#figlet -- -t -c "$SYSTEM" | nix run nixpkgs#lolcat
        deploy --hostname $SYSTEM .#$SYSTEM
      done
  tags:
    - nix
  needs:
    - setup_ssh_and_vault

deploy_public_hosting:
  <<: *deploy_template
  variables:
    DEPLOY_TYPE: "public"
  rules:
    - changes:
        - "**/public-hosting/default.nix"

deploy_lan_hosting:
  <<: *deploy_template
  variables:
    DEPLOY_TYPE: "lan"
  rules:
    - changes:
        - "**/lan-hosting/default.nix"
