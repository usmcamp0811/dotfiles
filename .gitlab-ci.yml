stages:
  - update
  - build

update-flake:
  stage: update
  tags:
    - nix
  only:
    - nixos
  script:
    - git rm flake.lock
    - nix flake update
  artifacts:
    paths:
      - flake.lock
    expire_in: 6 hour

build-jobs:
  stage: build
  tags:
    - nix
  only:
    - nixos
  script:
    - chmod +x generate_pipeline.sh
    - ./generate_pipeline.sh | tee dynamic-builds.yml
  artifacts:
    paths:
      - dynamic-builds.yml
    expire_in: 6 hour
  trigger:
    include:
      - artifact: dynamic-builds.yml
        job: build-jobs
