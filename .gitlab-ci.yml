#         - "./modules/nixos/suites/lan-hosting/default.nix"

update-flake:
  stage: update
  tags:
    - nix
  script:
    - git rm flake.lock
    - nix flake update
  artifacts:
    paths:
      - flake.lock
    expire_in: 1 hour
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: always

build_job_template: &build_job_template
  stage: build
  tags:
    - nix
  script:
    - nix build .#nixosConfigurations.${SYSTEM}.config.system.build.toplevel -j 1
  needs:
    - update-flake
  resource_group: build_sequential
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: always

butler:
  <<: *build_job_template
  variables:
    SYSTEM: "butler"

daly:
  <<: *build_job_template
  variables:
    SYSTEM: "daly"

lucas:
  <<: *build_job_template
  variables:
    SYSTEM: "lucas"

chesty:
  <<: *build_job_template
  variables:
    SYSTEM: "chesty"

webb:
  <<: *build_job_template
  variables:
    SYSTEM: "webb"

reckless:
  <<: *build_job_template
  variables:
    SYSTEM: "reckless"

.deploy_template: &deploy_template
  stage: hosting
  script:
    - echo "Authenticating with Vault..."
    - vault write auth/approle/login role_id="$VAULT_ROLE_ID" secret_id="$VAULT_SECRET_ID"
    - export VAULT_TOKEN=$(vault write -field=token auth/approle/login role_id="$VAULT_ROLE_ID" secret_id="$VAULT_SECRET_ID")
    - |
      SYSTEMS=$(get-lan-pub-systems $DEPLOY_TYPE)
      echo $SYSTEMS
      eval "$(ssh-agent -s)"
      vault kv get -field="lucas_CI_SERVER_URL" "secret/campground/gitlab-runner"
      sshkey=$(vault kv get -field="sshkey" "secret/campground/gitlab-runner")
      mkdir -p ~/.ssh

      echo "$sshkey" | ssh-add -
      for SYSTEM in $SYSTEMS; do
        ssh-keyscan $SYSTEM >> ~/.ssh/known_hosts
        nix run nixpkgs#figlet -- -t -c "$SYSTEM" | nix run nixpkgs#lolcat
        deploy --hostname $SYSTEM .#$SYSTEM
      done
  tags:
    - nix

deploy_public:
  <<: *deploy_template
  variables:
    DEPLOY_TYPE: "public"
  rules:
    - changes:
        - "./modules/nixos/suites/public-hosting/default.nix"
      when: always

deploy_lan:
  <<: *deploy_template
  variables:
    DEPLOY_TYPE: "lan"
  rules:
    - changes:
        - "./modules/nixos/suites/lan-hosting/default.nix"
      when: always
