# TODO: Clean this up break things out do good stuff
stages:
  - update
  - build
  - deploy

workflow:
  rules:
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: always

update-flake:
  stage: update
  tags:
    - nix
  only:
    - nixos
  script:
    - git rm flake.lock
    - nix flake update
  artifacts:
    paths:
      - flake.lock
    expire_in: 1 hour

butler:
  stage: build
  variables:
    SYSTEM: "butler"
  tags:
    - nix
  only:
    - nixos
  script:
    - nix build .#nixosConfigurations.${SYSTEM}.config.system.build.toplevel -j 1;
    - nix build .#nixosConfigurations.${SYSTEM}.config.system.build.toplevel -j 1;
  needs:
    - update-flake
  resource_group: build_sequential

