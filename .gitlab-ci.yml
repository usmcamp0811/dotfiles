#         - "./modules/nixos/suites/lan-hosting/default.nix"

update-flake:
  stage: update
  tags:
    - nix
  script:
    - git rm flake.lock
    - nix flake update
  artifacts:
    paths:
      - flake.lock
    expire_in: 1 hour
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: always

build_job_template: &build_job_template
  stage: build
  tags:
    - nix
  script:
    - nix build .#nixosConfigurations.${SYSTEM}.config.system.build.toplevel -j 1
  needs:
    - update-flake
  resource_group: build_sequential
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: always

butler:
  <<: *build_job_template
  variables:
    SYSTEM: "butler"

daly:
  <<: *build_job_template
  variables:
    SYSTEM: "daly"

lucas:
  <<: *build_job_template
  variables:
    SYSTEM: "lucas"

chesty:
  <<: *build_job_template
  variables:
    SYSTEM: "chesty"

webb:
  <<: *build_job_template
  variables:
    SYSTEM: "webb"

reckless:
  <<: *build_job_template
  variables:
    SYSTEM: "reckless"

.deploy_template: &deploy_template
  stage: hosting
  script:
    - |
      nix shell nixpkgs#figlet --command figlet -t -c "WHAT THE FUCK"
      nix shell nixpkgs#jq nixpkgs#expect nixpkgs#vault --command bash

      # Determine the hosting type based on the argument
      if [ "$DEPLOY_TYPE" = "public" ]; then
        ENABLED_PATH=".config.campground.suites.public-hosting.enable"
      elif [ "$DEPLOY_TYPE" = "lan" ]; then
        ENABLED_PATH=".config.campground.suites.lan-hosting.enable"
      else
        echo "Invalid type: $TYPE"
        exit 1
      fi

      SYSTEMS=$(nix eval --json '.#nixosConfigurations' --apply "
        configurations: (builtins.filter (name: 
          configurations.\${name}$ENABLED_PATH == true
        ) (builtins.attrNames configurations))
      " | jq -r '.[]')

      echo $SYSTEMS
      # for SYSTEM in $SYSTEMS; do
      #   echo "$SYSTEM"
      #   ./ci-scripts/deploy-script.sh "${SYSTEM}"
      # done
  tags:
    - nix

deploy_public:
  <<: *deploy_template
  variables:
    DEPLOY_TYPE: "public"
  rules:
    - changes:
        - "./modules/nixos/suites/public-hosting/default.nix"
      when: always

deploy_lan:
  <<: *deploy_template
  variables:
    DEPLOY_TYPE: "lan"
  rules:
    - changes:
        - "./modules/nixos/suites/lan-hosting/default.nix"
      when: always
