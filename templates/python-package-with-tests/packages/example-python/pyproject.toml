[project]
name = "example-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.8",
    "matplotlib>=3.10.1",
    "numpy>=2.2.5",
    "pandas>=2.2.3",
    "plotext>=5.2",
    "scikit-learn>=1.6.1",
]
[project.scripts]
example-python-env = "hello:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
test = [
  "pytest-cov>=6.0.0",
  "pytest>=8.3.3",
]
